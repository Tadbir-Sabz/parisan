name: PHP lint

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find theme plugin tests -type f -name '*.php' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run schedule and availability tests
        run: php tests/run-schedule-tests.php

  wordpress-smoke:
    name: WordPress activation smoke test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, curl, mbstring, zip
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install disposable WordPress
        env:
          WP_PATH: ${{ runner.temp }}/parisan-wordpress
        run: |
          set -euo pipefail
          wp core download --path="$WP_PATH" --quiet
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://localhost --title="Parisan CI" --admin_user=parisan-ci --admin_password="ci-only-password" --admin_email=ci@example.test --skip-email
          mkdir -p "$WP_PATH/wp-content/themes" "$WP_PATH/wp-content/plugins"
          cp -R theme/parisan "$WP_PATH/wp-content/themes/parisan"
          cp -R plugin/parisan-core "$WP_PATH/wp-content/plugins/parisan-core"
          wp plugin activate parisan-core --path="$WP_PATH"
          wp theme activate parisan --path="$WP_PATH"

      - name: Verify registrations and template assets
        env:
          WP_PATH: ${{ runner.temp }}/parisan-wordpress
        run: |
          set -euo pipefail
          wp eval '
            if ( ! post_type_exists( "parisan_service" ) || ! post_type_exists( "parisan_staff" ) ) {
              fwrite( STDERR, "Expected Parisan post types were not registered.\n" );
              exit( 1 );
            }
            if ( ! taxonomy_exists( "parisan_service_category" ) ) {
              fwrite( STDERR, "Service category taxonomy was not registered.\n" );
              exit( 1 );
            }
            global $wpdb;
            foreach ( array( "parisan_bookings", "parisan_booking_events", "parisan_schedule_exceptions" ) as $suffix ) {
              $table = $wpdb->prefix . $suffix;
              $found = $wpdb->get_var( $wpdb->prepare( "SHOW TABLES LIKE %s", $table ) );
              if ( $table !== $found ) {
                fwrite( STDERR, "Expected schema table missing: " . $suffix . "\\n" );
                exit( 1 );
              }
              $table_status = $wpdb->get_row( $wpdb->prepare( "SHOW TABLE STATUS LIKE %s", $wpdb->esc_like( $table ) ), ARRAY_A );
              if ( ! is_array( $table_status ) || "InnoDB" !== $table_status["Engine"] ) {
                fwrite( STDERR, "Expected InnoDB engine for " . $suffix . "\\n" );
                exit( 1 );
              }
            }
            if ( 1 !== (int) get_option( "parisan_core_db_version", 0 ) ) {
              fwrite( STDERR, "Parisan schema version was not recorded.\\n" );
              exit( 1 );
            }
            if ( ! function_exists( "parisan_core_normalize_weekly_schedule" ) || ! function_exists( "parisan_core_local_interval_to_utc" ) || ! function_exists( "parisan_core_handle_schedule_exception_create" ) ) {
              fwrite( STDERR, "Schedule/exception components were not loaded.\\n" );
              exit( 1 );
            }
            $service_id = wp_insert_post( array(
              "post_type"   => "parisan_service",
              "post_status" => "publish",
              "post_title"  => "Synthetic CI service",
            ), true );
            if ( is_wp_error( $service_id ) ) {
              fwrite( STDERR, $service_id->get_error_message() . "\n" );
              exit( 1 );
            }
            update_post_meta( $service_id, "_parisan_duration", 45 );
            if ( 45 !== absint( get_post_meta( $service_id, "_parisan_duration", true ) ) ) {
              fwrite( STDERR, "Service metadata did not persist.\n" );
              exit( 1 );
            }
            $staff_id = wp_insert_post( array(
              "post_type"   => "parisan_staff",
              "post_status" => "publish",
              "post_title"  => "Synthetic CI specialist",
            ), true );
            if ( is_wp_error( $staff_id ) ) {
              fwrite( STDERR, $staff_id->get_error_message() . "\\n" );
              exit( 1 );
            }
            update_post_meta( $staff_id, "_parisan_staff_services", array( $service_id ) );
            update_post_meta( $staff_id, "_parisan_staff_weekly_schedule", parisan_core_normalize_weekly_schedule( array(
              1 => array( "start" => "09:00", "end" => "12:00" ),
            ) ) );
            update_option( "timezone_string", "UTC" );
            $booking_table = $wpdb->prefix . "parisan_bookings";
            $booking_inserted = $wpdb->insert( $booking_table, array(
              "public_id" => wp_generate_uuid4(),
              "service_id" => $service_id,
              "staff_id" => $staff_id,
              "customer_name" => "Synthetic CI customer",
              "customer_phone" => "0000000000",
              "customer_email" => "",
              "starts_at_utc" => "2026-11-09 09:00:00",
              "ends_at_utc" => "2026-11-09 09:45:00",
              "salon_timezone" => "UTC",
              "status" => "confirmed",
              "price_amount" => 0,
              "currency_code" => "IRR",
              "idempotency_key" => hash( "sha256", "parisan-ci-booking" ),
              "created_at_utc" => "2026-11-01 00:00:00",
              "updated_at_utc" => "2026-11-01 00:00:00",
            ) );
            if ( false === $booking_inserted ) {
              fwrite( STDERR, "Synthetic booking insert failed: " . $wpdb->last_error . "\\n" );
              exit( 1 );
            }
            $exception_table = $wpdb->prefix . "parisan_schedule_exceptions";
            $exception_inserted = $wpdb->insert( $exception_table, array(
              "staff_id" => $staff_id,
              "starts_at_utc" => "2026-11-09 10:00:00",
              "ends_at_utc" => "2026-11-09 10:30:00",
              "exception_type" => "unavailable",
              "note" => "Synthetic CI leave",
              "created_at_utc" => "2026-11-01 00:00:00",
            ) );
            if ( false === $exception_inserted ) {
              fwrite( STDERR, "Synthetic exception insert failed: " . $wpdb->last_error . "\\n" );
              exit( 1 );
            }
            $slots = parisan_core_get_available_slots( $staff_id, $service_id, "2026-11-09" );
            if ( is_wp_error( $slots ) || ! is_array( $slots ) || empty( $slots ) || "2026-11-09 10:30" !== $slots[0]["starts_at_local"] ) {
              fwrite( STDERR, "Availability adapter did not exclude seeded booking/exception intervals.\\n" );
              exit( 1 );
            }
            echo "WordPress activation, schema, and seeded availability integration test passed.\\n";
          ' --path="$WP_PATH"
          test -f "$WP_PATH/wp-content/themes/parisan/front-page.php"
          test -f "$WP_PATH/wp-content/themes/parisan/archive-parisan_service.php"
          test -f "$WP_PATH/wp-content/themes/parisan/single-parisan_service.php"

      - name: Verify transactional booking service
        env:
          WP_PATH: ${{ runner.temp }}/parisan-wordpress
        run: |
          set -euo pipefail
          wp eval '
            global $wpdb;
            $service_id = (int) $wpdb->get_var( "SELECT ID FROM {$wpdb->posts} WHERE post_type = \"parisan_service\" AND post_status = \"publish\" ORDER BY ID DESC LIMIT 1" );
            $staff_id = (int) $wpdb->get_var( "SELECT ID FROM {$wpdb->posts} WHERE post_type = \"parisan_staff\" AND post_status = \"publish\" ORDER BY ID DESC LIMIT 1" );
            if ( ! $service_id || ! $staff_id || ! function_exists( "parisan_core_create_booking" ) ) {
              fwrite( STDERR, "Booking service prerequisites are missing.\\n" );
              exit( 1 );
            }
            update_post_meta( $service_id, "_parisan_price", 1200 );
            if ( ! function_exists( "parisan_core_acquire_staff_schedule_lock" ) || ! function_exists( "parisan_core_release_staff_schedule_lock" ) ) {
              fwrite( STDERR, "Shared staff schedule lock helpers were not loaded.\\n" );
              exit( 1 );
            }
            $probe_lock = parisan_core_acquire_staff_schedule_lock( $staff_id );
            if ( is_wp_error( $probe_lock ) ) {
              fwrite( STDERR, "Could not acquire the staff schedule lock.\\n" );
              exit( 1 );
            }
            parisan_core_release_staff_schedule_lock( $probe_lock );
            $payload = array(
              "service_id" => $service_id,
              "staff_id" => $staff_id,
              "starts_at_local" => "2026-11-09 10:30",
              "customer_name" => "Synthetic booking customer",
              "customer_phone" => "09123456789",
              "customer_email" => "booking@example.test",
              "idempotency_token" => "ci-idempotency-token-0001",
            );
            $created = parisan_core_create_booking( $payload );
            if ( is_wp_error( $created ) || empty( $created["booking_id"] ) || ! empty( $created["reused"] ) ) {
              fwrite( STDERR, "Booking creation failed: " . ( is_wp_error( $created ) ? $created->get_error_code() : "unexpected result" ) . "\\n" );
              exit( 1 );
            }
            $event_count = (int) $wpdb->get_var( $wpdb->prepare( "SELECT COUNT(*) FROM {$wpdb->prefix}parisan_booking_events WHERE booking_id = %d AND event_type = \"created\"", $created["booking_id"] ) );
            $stored = $wpdb->get_row( $wpdb->prepare( "SELECT status, price_amount, currency_code FROM {$wpdb->prefix}parisan_bookings WHERE id = %d", $created["booking_id"] ), ARRAY_A );
            if ( 1 !== $event_count || ! is_array( $stored ) || "pending" !== $stored["status"] || 12000 !== (int) $stored["price_amount"] || "IRR" !== $stored["currency_code"] ) {
              fwrite( STDERR, "Booking and audit event were not persisted with the expected snapshot.\\n" );
              exit( 1 );
            }
            $replayed = parisan_core_create_booking( $payload );
            if ( is_wp_error( $replayed ) || empty( $replayed["reused"] ) || (int) $replayed["booking_id"] !== (int) $created["booking_id"] ) {
              fwrite( STDERR, "Same-payload idempotent replay did not return the original booking.\\n" );
              exit( 1 );
            }
            $conflict_payload = $payload;
            $conflict_payload["customer_name"] = "Different synthetic customer";
            $conflict = parisan_core_create_booking( $conflict_payload );
            if ( ! is_wp_error( $conflict ) || "parisan_idempotency_conflict" !== $conflict->get_error_code() ) {
              fwrite( STDERR, "Reused idempotency token with a changed payload was not rejected.\\n" );
              exit( 1 );
            }
            $overlap_payload = $payload;
            $overlap_payload["idempotency_token"] = "ci-idempotency-token-0002";
            $overlap = parisan_core_create_booking( $overlap_payload );
            if ( ! is_wp_error( $overlap ) || "parisan_booking_slot_unavailable" !== $overlap->get_error_code() ) {
              fwrite( STDERR, "Overlapping booking was not rejected after locked availability recheck.\\n" );
              exit( 1 );
            }
            update_post_meta( $service_id, "_parisan_price_type", "from" );
            $from_price_payload = $payload;
            $from_price_payload["idempotency_token"] = "ci-idempotency-token-0003";
            $from_price = parisan_core_create_booking( $from_price_payload );
            if ( ! is_wp_error( $from_price ) || "parisan_service_requires_price_confirmation" !== $from_price->get_error_code() ) {
              fwrite( STDERR, "A starting-from service price was incorrectly accepted as a final booking price.\\n" );
              exit( 1 );
            }
            $trigger_name = "parisan_ci_fail_booking_event";
            $events_table = $wpdb->prefix . "parisan_booking_events";
            $quoted_events_table = "`" . str_replace( "`", "``", $events_table ) . "`";
            $trigger_created = $wpdb->query( "CREATE TRIGGER " . $trigger_name . " BEFORE INSERT ON " . $quoted_events_table . " FOR EACH ROW SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'forced audit failure'" );
            if ( false === $trigger_created ) {
              fwrite( STDERR, "Could not create the disposable audit-failure trigger: " . $wpdb->last_error . "\\n" );
              exit( 1 );
            }
            $rollback_payload = $payload;
            $rollback_payload["starts_at_local"] = "2026-11-09 11:00";
            $rollback_payload["idempotency_token"] = "ci-idempotency-token-0004";
            $rollback_result = null;
            try {
              $rollback_result = parisan_core_create_booking( $rollback_payload );
            } finally {
              $wpdb->query( "DROP TRIGGER IF EXISTS " . $trigger_name );
            }
            $rollback_key = hash( "sha256", $rollback_payload["idempotency_token"] );
            $rollback_booking_count = (int) $wpdb->get_var( $wpdb->prepare( "SELECT COUNT(*) FROM {$wpdb->prefix}parisan_bookings WHERE idempotency_key = %s", $rollback_key ) );
            if ( ! is_wp_error( $rollback_result ) || "parisan_booking_audit_failed" !== $rollback_result->get_error_code() || 0 !== $rollback_booking_count ) {
              fwrite( STDERR, "Audit-event failure did not roll back the booking atomically.\\n" );
              exit( 1 );
            }
            echo "Transactional booking creation, InnoDB, shared lock, audit event, idempotency, overlap rejection, fixed-price gate, and audit-failure rollback passed.\\n";
          ' --path="$WP_PATH"
