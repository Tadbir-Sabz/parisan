name: PHP lint

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find theme plugin -type f -name '*.php' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
