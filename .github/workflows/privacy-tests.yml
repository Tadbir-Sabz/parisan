name: Privacy and abuse-control tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-tests:
    name: Privacy/rate-limit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint privacy module and tests
        run: |
          php -l plugin/parisan-core/includes/privacy.php
          php -l tests/run-privacy-tests.php

      - name: Run privacy and rate-limit assertions
        run: php tests/run-privacy-tests.php
