name: Parisan browser smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    name: WordPress desktop/mobile browser smoke
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, curl, mbstring, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install disposable WordPress
        env:
          WP_PATH: ${{ runner.temp }}/parisan-browser-wordpress
        run: |
          set -euo pipefail
          wp core download --path="$WP_PATH" --quiet
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title="Parisan Browser CI" --admin_user=parisan-ci --admin_password="ci-only-password" --admin_email=ci@example.test --skip-email
          wp option update WPLANG fa_IR --path="$WP_PATH"
          mkdir -p "$WP_PATH/wp-content/themes" "$WP_PATH/wp-content/plugins"
          cp -R theme/parisan "$WP_PATH/wp-content/themes/parisan"
          cp -R plugin/parisan-core "$WP_PATH/wp-content/plugins/parisan-core"
          wp plugin activate parisan-core --path="$WP_PATH"
          wp theme activate parisan --path="$WP_PATH"
          cat > "$WP_PATH/router.php" <<'PHP'
          <?php
          $path = parse_url( $_SERVER['REQUEST_URI'], PHP_URL_PATH );
          if ( is_string( $path ) && is_file( __DIR__ . $path ) ) {
              return false;
          }
          require __DIR__ . '/index.php';
          PHP

      - name: Start disposable WordPress HTTP server
        env:
          WP_PATH: ${{ runner.temp }}/parisan-browser-wordpress
        run: |
          php -S 127.0.0.1:8080 -t "$WP_PATH" "$WP_PATH/router.php" > "$RUNNER_TEMP/parisan-php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/parisan-php-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/parisan-php-server.log"
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify desktop and mobile experience
        run: |
          mkdir -p artifacts
          node tests/browser-smoke.js

      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parisian-browser-evidence
          path: |
            artifacts/
            ${{ runner.temp }}/parisan-php-server.log
          if-no-files-found: warn
