name: Parisan browser smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    name: WordPress desktop/mobile browser smoke
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, curl, mbstring, zip, gd
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run theme JavaScript unit tests
        run: node tests/run-theme-js-tests.js

      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install disposable WordPress
        env:
          WP_PATH: ${{ runner.temp }}/parisan-browser-wordpress
        run: |
          set -euo pipefail
          wp core download --path="$WP_PATH" --quiet
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title="استودیو زیبایی پاریسان" --admin_user=parisan-ci --admin_password="ci-only-password" --admin_email=ci@example.test --skip-email
          wp option update WPLANG fa_IR --path="$WP_PATH"
          mkdir -p "$WP_PATH/wp-content/themes" "$WP_PATH/wp-content/plugins"
          cp -R theme/parisan "$WP_PATH/wp-content/themes/parisan"
          cp -R plugin/parisan-core "$WP_PATH/wp-content/plugins/parisan-core"
          wp plugin activate parisan-core --path="$WP_PATH"
          wp theme activate parisan --path="$WP_PATH"
          # Replace WordPress's generic starter content with deterministic Persian salon fixtures.
          wp post delete 1 --force --path="$WP_PATH"
          wp post create --path="$WP_PATH" --post_type=post --post_status=publish --post_title="راهنمای انتخاب خدمات مراقبت پوست" --post_excerpt="چطور خدمات متناسب با نیاز پوست خود را آگاهانه انتخاب کنیم؟" --post_content="در این راهنما با چند نکته کاربردی برای انتخاب خدمات مراقبت پوست آشنا می‌شوید." --porcelain
          # Generate local abstract thumbnails so browser evidence tests populated cards, not empty placeholders.
          cat > "$WP_PATH/create-fixtures.php" <<'PHP'
          <?php
          $items = array(
              'service-skin' => array( 224, 190, 199 ),
              'service-brow' => array( 178, 133, 155 ),
              'portfolio-one' => array( 194, 155, 174 ),
              'portfolio-two' => array( 207, 176, 185 ),
              'portfolio-three' => array( 158, 119, 143 ),
              'staff-one' => array( 211, 183, 167 ),
              'staff-two' => array( 183, 145, 164 ),
              'journal' => array( 225, 203, 193 ),
          );
          foreach ( $items as $name => $rgb ) {
              $image = imagecreatetruecolor( 1200, 900 );
              for ( $y = 0; $y < 900; $y++ ) {
                  $mix = $y / 900;
                  $color = imagecolorallocate( $image, (int) ( $rgb[0] + ( 247 - $rgb[0] ) * $mix ), (int) ( $rgb[1] + ( 235 - $rgb[1] ) * $mix ), (int) ( $rgb[2] + ( 232 - $rgb[2] ) * $mix ) );
                  imageline( $image, 0, $y, 1200, $y, $color );
              }
              $ring = imagecolorallocatealpha( $image, 255, 248, 241, 65 );
              $soft = imagecolorallocatealpha( $image, 255, 248, 241, 82 );
              imageellipse( $image, 600, 450, 560, 560, $ring );
              imageellipse( $image, 600, 450, 420, 420, $soft );
              imagefilledellipse( $image, 600, 450, 230, 230, $soft );
              imagefilledellipse( $image, 740, 340, 90, 90, $ring );
              imagepng( $image, __DIR__ . '/' . $name . '.png' );
              imagedestroy( $image );
          }
          PHP
          php "$WP_PATH/create-fixtures.php"
          SERVICE_ID=$(wp post create --path="$WP_PATH" --post_type=parisan_service --post_status=publish --post_title="پاکسازی و آبرسانی پوست" --post_excerpt="مراقبت تخصصی برای طراوت و شادابی پوست." --post_content="یک تجربه مراقبتی با توجه به نوع پوست و نیازهای شما." --porcelain)
          wp post meta update "$SERVICE_ID" _parisan_duration 60 --path="$WP_PATH"
          wp post meta update "$SERVICE_ID" _parisan_price 850000 --path="$WP_PATH"
          wp post create --path="$WP_PATH" --post_type=parisan_service --post_status=publish --post_title="طراحی و فرم‌دهی ابرو" --post_excerpt="فرم‌دهی متناسب با چهره با دقت و ظرافت." --post_content="مشاوره و اجرای فرم دلخواه با توجه به تناسب چهره." --porcelain
          STAFF_ID=$(wp post create --path="$WP_PATH" --post_type=parisan_staff --post_status=publish --post_title="نگار احمدی" --post_excerpt="متخصص مراقبت و زیبایی پوست." --post_content="با تمرکز بر تجربه‌ای آرام و انتخاب آگاهانه خدمات." --porcelain)
          wp post meta update "$STAFF_ID" _parisan_staff_role "متخصص مراقبت پوست" --path="$WP_PATH"
          STAFF_ID=$(wp post create --path="$WP_PATH" --post_type=parisan_staff --post_status=publish --post_title="سارا محمدی" --post_excerpt="متخصص طراحی و زیبایی ابرو." --post_content="توجه به جزئیات و تناسب طبیعی، بخشی از رویکرد کاری اوست." --porcelain)
          wp post meta update "$STAFF_ID" _parisan_staff_role "متخصص زیبایی" --path="$WP_PATH"
          wp post create --path="$WP_PATH" --post_type=parisan_portfolio --post_status=publish --post_title="درخشش طبیعی" --post_excerpt="نمونه‌ای از زیبایی ساده و متناسب." --post_content="نمونه‌کار نمایشی برای آزمون چیدمان گالری." --porcelain
          wp post create --path="$WP_PATH" --post_type=parisan_portfolio --post_status=publish --post_title="جزئیات ظریف" --post_excerpt="توجه به جزئیات در اجرای خدمات." --post_content="نمونه‌کار نمایشی دوم برای آزمون گالری." --porcelain
          wp post create --path="$WP_PATH" --post_type=parisan_portfolio --post_status=publish --post_title="سبک هماهنگ" --post_excerpt="هماهنگی سبک و سلیقه شخصی." --post_content="نمونه‌کار نمایشی سوم برای آزمون گالری." --porcelain
          SERVICE_ID=$(wp post list --path="$WP_PATH" --post_type=parisan_service --field=ID --format=ids | awk '{print $1}')
          wp media import "$WP_PATH/service-skin.png" --post_id="$SERVICE_ID" --featured_image --path="$WP_PATH" --quiet
          SERVICE_ID=$(wp post list --path="$WP_PATH" --post_type=parisan_service --field=ID --format=ids | awk '{print $2}')
          wp media import "$WP_PATH/service-brow.png" --post_id="$SERVICE_ID" --featured_image --path="$WP_PATH" --quiet
          INDEX=0
          for ID in $(wp post list --path="$WP_PATH" --post_type=parisan_portfolio --field=ID --format=ids); do
            INDEX=$((INDEX + 1))
            case "$INDEX" in 1) IMAGE=portfolio-one;; 2) IMAGE=portfolio-two;; *) IMAGE=portfolio-three;; esac
            wp media import "$WP_PATH/$IMAGE.png" --post_id="$ID" --featured_image --path="$WP_PATH" --quiet
          done
          INDEX=0
          for ID in $(wp post list --path="$WP_PATH" --post_type=parisan_staff --field=ID --format=ids); do
            INDEX=$((INDEX + 1))
            if [ "$INDEX" -eq 1 ]; then IMAGE=staff-one; else IMAGE=staff-two; fi
            wp media import "$WP_PATH/$IMAGE.png" --post_id="$ID" --featured_image --path="$WP_PATH" --quiet
          done
          POST_ID=$(wp post list --path="$WP_PATH" --post_type=post --field=ID --format=ids | awk '{print $1}')
          wp media import "$WP_PATH/journal.png" --post_id="$POST_ID" --featured_image --path="$WP_PATH" --quiet
          cat > "$WP_PATH/router.php" <<'PHP'
          <?php
          $path = parse_url( $_SERVER['REQUEST_URI'], PHP_URL_PATH );
          if ( is_string( $path ) && is_file( __DIR__ . $path ) ) {
              return false;
          }
          require __DIR__ . '/index.php';
          PHP

      - name: Start disposable WordPress HTTP server
        env:
          WP_PATH: ${{ runner.temp }}/parisan-browser-wordpress
        run: |
          php -S 127.0.0.1:8080 -t "$WP_PATH" "$WP_PATH/router.php" > "$RUNNER_TEMP/parisan-php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/parisan-php-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/parisan-php-server.log"
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify desktop and mobile experience
        run: |
          mkdir -p artifacts
          node tests/browser-smoke.js

      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parisian-browser-evidence
          path: |
            artifacts/
            ${{ runner.temp }}/parisan-php-server.log
          if-no-files-found: warn
